[build]
  command = "bun run build"
  publish = "dist"

# Single-page app fallback: invite links like /MedhaWedsSaptarshi/invite/<code>
# and /studio are handled by client-side routing, so serve index.html for any
# path that doesn't match a real file.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/videos/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/photos/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
